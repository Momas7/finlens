name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://finlens_app:finlens_app@localhost:5432/finlens
  DATABASE_OWNER_URL: postgres://finlens_owner:finlens_owner@localhost:5432/finlens
  TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-000000
  BETTER_AUTH_URL: http://localhost:3000
  WEB_ORIGIN: http://localhost:3000
  API_URL: http://localhost:3333
  PORT: 3333
  LOG_LEVEL: warn

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Classifier evaluation gate
        run: pnpm eval:classifier --check
      - run: pnpm --filter @finlens/web build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f infra/postgres/init/01-roles.sql
        env:
          PGPASSWORD: postgres
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create database roles
        run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f infra/postgres/init/01-roles.sql
        env:
          PGPASSWORD: postgres
      - run: pnpm --filter @finlens/db db:migrate
      - run: pnpm --filter @finlens/web exec playwright install --with-deps chromium
      - run: pnpm --filter @finlens/web test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  demo:
    # Garante que "Experimente em 1 comando" do README continua funcionando.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start demo profile
        run: docker compose --profile demo up --build -d
      - name: Wait for the demo seed
        run: |
          for i in $(seq 1 100); do
            status=$(docker compose --profile demo ps -a seed --format '{{.State}} {{.ExitCode}}')
            case "$status" in
              exited\ 0) echo "seed ok"; break ;;
              exited*) echo "seed falhou: $status"; docker compose --profile demo logs; exit 1 ;;
            esac
            sleep 3
          done
          docker compose --profile demo logs seed | grep -q "Conta demo criada"
      - name: Login page responds
        run: curl -fsS -o /dev/null http://localhost:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose --profile demo logs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # CLI oficial via container: varre todo o histórico, sem depender de permissões
      # de PR nem do intervalo before..after do push (que quebra no primeiro push).
      - name: Scan history with gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --redact --verbose --exit-code 1
